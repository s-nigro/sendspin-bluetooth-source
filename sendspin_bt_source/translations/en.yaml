configuration:
  device_name:
    name: Bluetooth name
    description: Name shown on the projector, TV or phone (sets the alias of the selected adapter).
  adapter:
    name: Bluetooth adapter
    description: hciX or MAC address of the dongle. Empty = first adapter.
  discoverable:
    name: Pairing mode
    description: Visible and new devices may pair. Already paired devices can always reconnect.
  discoverable_timeout:
    name: Pairing mode duration (minutes)
    description: Only visible for this long after start. 0 = always visible.
  allowed_devices:
    name: Allowed devices
    description: List of MAC addresses. Empty = any device may pair while pairing mode is on.
  remove_devices:
    name: Remove devices (unpair)
    description: MAC addresses unpaired at start, e.g. to pair them again. Paired devices are listed in the log at start. Clear the list afterwards.
  delay_report_ms:
    name: Reported delay (ms)
    description: Reported to the projector/TV over Bluetooth so it delays the picture (lip sync).
  enable_aac:
    name: Offer AAC
    description: Better quality; Android/Google TV prefers AAC. SBC is always available.
  claim_streams:
    name: Take over streams from other receivers
    description: If a device sends its audio to another Bluetooth receiver on this host (e.g. the HA audio system), the add-on takes the stream over.
  restart_audio_on_start:
    name: Restart HA audio on start
    description: So projectors/TVs that only support SBC land on this add-on instead of the HA audio system's Bluetooth receiver. Speakers of the Bluetooth Bridge reconnect briefly.
  apply_remote_volume:
    name: Follow device volume
    description: Volume keys on the projector/phone control the Live Input level.
  silence_timeout:
    name: Silence until "no signal" (seconds)
    description: After this much silence the input reports no signal. 0 = never.
  stream_codec:
    name: Codec to Music Assistant
    description: pcm (lowest latency, default), flac or opus.
  server_url:
    name: Music Assistant address (optional)
    description: "auto = connect to Music Assistant on this host (recommended if MA does not connect by itself). Or a URL like ws://192.168.1.10:8927/sendspin. Empty = wait for MA to find the add-on via mDNS."
  listen_port:
    name: Port
    description: Port Music Assistant uses to reach the add-on.
  set_device_class:
    name: Present as loudspeaker
    description: Sets the Bluetooth device class to audio/loudspeaker so TVs list it as a speaker.
  calibration_mic:
    name: Measuring microphone (ESP32)
    description: IP address or name of the ESP32 running the ESPHome component sendspin_latency_mic, optionally with :port (default 8939).
  calibration_key:
    name: Key for the measuring microphone
    description: Same as key in the ESPHome configuration (at least 8 characters).
  mic_offset_ms:
    name: Microphone correction (ms)
    description: Subtracted from every result if the microphone itself has a known delay. Usually 0.
  log_level:
    name: Log level
