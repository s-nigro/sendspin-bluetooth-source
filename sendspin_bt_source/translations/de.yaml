configuration:
  device_name:
    name: Bluetooth-Name
    description: So erscheint das Gerät auf Beamer, TV und Handy (setzt den Namen des gewählten Adapters).
  adapter:
    name: Bluetooth-Adapter
    description: hciX oder MAC-Adresse des Dongles. Leer = erster Adapter.
  discoverable:
    name: Kopplungsmodus
    description: Gerät ist sichtbar und neue Geräte dürfen koppeln. Bereits gekoppelte Geräte verbinden sich immer.
  discoverable_timeout:
    name: Kopplungsmodus-Dauer (Minuten)
    description: Nach dem Start nur so lange sichtbar. 0 = immer sichtbar.
  allowed_devices:
    name: Erlaubte Geräte
    description: Liste von MAC-Adressen. Leer = jedes Gerät darf koppeln (während der Kopplungsmodus aktiv ist).
  remove_devices:
    name: Geräte entfernen (entkoppeln)
    description: MAC-Adressen, die beim Start entkoppelt werden, z. B. um sie neu zu koppeln. Die gekoppelten Geräte stehen beim Start im Log. Danach wieder leeren.
  delay_report_ms:
    name: Gemeldete Verzögerung (ms)
    description: Wird per Bluetooth an Beamer/TV gemeldet, damit das Bild passend verzögert wird (Lippensynchronität).
  enable_aac:
    name: AAC anbieten
    description: Bessere Qualität; Android/Google TV bevorzugt AAC. SBC steht immer zur Verfügung.
  claim_streams:
    name: Ton von anderen Empfängern übernehmen
    description: Schickt ein Gerät seinen Ton an einen anderen Bluetooth-Empfänger auf diesem Rechner (z. B. das HA-Audiosystem), holt das Add-on den Stream zu sich.
  restart_audio_on_start:
    name: HA-Audiosystem beim Start neu starten
    description: Damit Beamer/TV, die nur SBC können, bei diesem Add-on landen statt beim Bluetooth-Empfänger des HA-Audiosystems. Boxen der Bluetooth Bridge verbinden sich dabei kurz neu.
  apply_remote_volume:
    name: Lautstärke vom Gerät übernehmen
    description: Lautstärketasten von Beamer/Handy regeln den Pegel des Live Inputs.
  silence_timeout:
    name: Stille bis "kein Signal" (Sekunden)
    description: Nach so viel Stille meldet der Eingang "kein Signal" (MA stoppt Auto-Play nach einer Minute). 0 = nie.
  stream_codec:
    name: Codec zu Music Assistant
    description: pcm (geringste Latenz, Standard), flac oder opus.
  server_url:
    name: Music-Assistant-Adresse (optional)
    description: "auto = selbst mit Music Assistant auf diesem Rechner verbinden (empfohlen, wenn MA nicht von selbst verbindet). Oder eine URL wie ws://192.168.1.10:8927/sendspin. Leer = warten, bis MA das Add-on per mDNS findet."
  listen_port:
    name: Port
    description: Port, auf dem Music Assistant das Add-on erreicht.
  set_device_class:
    name: Als Lautsprecher ausgeben
    description: Setzt die Bluetooth-Geräteklasse auf Audio/Lautsprecher, damit TVs das Gerät als Box anzeigen.
  calibration_mic:
    name: Mess-Mikrofon (ESP32)
    description: IP-Adresse oder Name des ESP32 mit der ESPHome-Komponente sendspin_latency_mic, optional mit :Port (Standard 8939).
  calibration_key:
    name: Schlüssel für das Mess-Mikrofon
    description: Derselbe Schlüssel wie key in der ESPHome-Konfiguration (mind. 8 Zeichen).
  mic_offset_ms:
    name: Mikrofon-Korrektur (ms)
    description: Wird von jedem Messwert abgezogen, falls das Mikrofon selbst eine bekannte Verzögerung hat. Normalerweise 0.
  log_level:
    name: Log-Level
